<script>
const HSP = 6.19;
const EFFICIENCY = 0.85;
const DESCUENTO_SUMA = 0.10;
const PRECIO_POR_KW = 19066; // MXN por kW instalado

// ─── CATÁLOGO DE INVERSORES ─────────────────────────────────────────────────
// monofasico: hasta 11.4kW; trifasico: 3kW en adelante
const CATALOGO_INVERSORES = {
  monofasico: {
    estandar: [
      { min:0,   max:3.6,  kw:3.6,  modelo:"Growatt / SMA / GOODWE / SOLIS 3-3.6kW Monofásico" },
      { min:3.6, max:5,    kw:5,    modelo:"Growatt / SMA / GOODWE / SOLIS 4-5kW Monofásico" },
      { min:5,   max:8,    kw:8,    modelo:"Growatt / SMA / GOODWE / SOLIS 6-8kW Monofásico" },
      { min:8,   max:11.4, kw:11.4, modelo:"Growatt / SMA / GOODWE / SOLIS 10-11.4kW Monofásico" }
    ],
    hibrido: [
      { min:0,   max:3.6,  kw:3.6,  modelo:"Solis S6-EH1P 3kW Híbrido Monofásico" },
      { min:3.6, max:5,    kw:5,    modelo:"Solis S6-EH1P 5kW Híbrido Monofásico" },
      { min:5,   max:8,    kw:8,    modelo:"Solis S6-EH1P 8kW Híbrido Monofásico" },
      { min:8,   max:11.4, kw:10,   modelo:"Solis S6-EH1P 10kW Híbrido Monofásico" }
    ]
  },
  trifasico: {
    estandar: [
      { min:0,   max:6,   kw:6,   modelo:"Growatt / SMA / GOODWE / SOLIS 3-6kW Trifásico" },
      { min:6,   max:10,  kw:10,  modelo:"Growatt / SMA / GOODWE / SOLIS / Sunny Tripower 8-10kW Trifásico" },
      { min:10,  max:25,  kw:25,  modelo:"Sunny Tripower X / Growatt / SMA 12-25kW Trifásico" },
      { min:25,  max:40,  kw:40,  modelo:"Growatt MAX / SMA / GOODWE 30-40kW Trifásico" },
      { min:40,  max:60,  kw:60,  modelo:"Growatt MAX / SMA / GOODWE / Sunny Tripower CORE1 50-60kW Trifásico" },
      { min:60,  max:100, kw:100, modelo:"Growatt MAX / SMA / GOODWE 75-100kW Trifásico" }
    ],
    hibrido: [
      { min:0,   max:6,   kw:5,   modelo:"GOODWE / SMA Storage 5kW Híbrido Trifásico" },
      { min:6,   max:10,  kw:10,  modelo:"GOODWE / SMA Storage 10kW Híbrido Trifásico" },
      { min:10,  max:25,  kw:25,  modelo:"GOODWE / SMA Storage 25kW Híbrido Trifásico" }
    ]
  }
};

// Tarifas que OBLIGAN trifásico
const TARIFAS_TRIFASICO = ['GDBT','GDMTO','GDMTH','DIST','DIT','APBT','RABT'];
// Tarifas comerciales/industriales
const TARIFAS_COMERCIALES = ['PDBT','GDBT','GDMTO','GDMTH','DIST','DIT','APBT','RABT'];

const TARIFAS_CFE_2026 = {
  basico:     { limite: 150, precio: 1.04 },
  intermedio: { limite: 130, precio: 1.27 },
  excedente:  { precio: 3.73 },
  dac:        { umbral: 500, precio: 6.75 },
  iva: 0.16
};

// ─── LÓGICA DE DISEÑO DE SISTEMA ────────────────────────────────────────────
function disenarSistema(kwTotal, fase, tipoInv) {
  const maxInversor = (fase === 'monofasico') ? 11.4 : 100;
  const catalogo = CATALOGO_INVERSORES[fase][tipoInv] || CATALOGO_INVERSORES[fase]['estandar'];

  // Encontrar el inversor unitario más adecuado
  function eligeInversor(kw) {
    for (let i = 0; i < catalogo.length; i++) {
      if (kw <= catalogo[i].max) return catalogo[i];
    }
    return catalogo[catalogo.length - 1];
  }

  if (kwTotal <= maxInversor) {
    const inv = eligeInversor(kwTotal);
    return { inversores: 1, kwPorInversor: inv.kw, kwTotal: inv.kw, modelo: inv.modelo };
  } else {
    // Múltiples inversores: dividir en partes iguales usando el más grande disponible
    const invMax = catalogo[catalogo.length - 1];
    const n = Math.ceil(kwTotal / invMax.kw);
    const kwCadaUno = Math.ceil(kwTotal / n);
    const invElegido = eligeInversor(kwCadaUno);
    return {
      inversores: n,
      kwPorInversor: invElegido.kw,
      kwTotal: n * invElegido.kw,
      modelo: invElegido.modelo
    };
  }
}

function calcularReciboCFE(kwhMensual) {
  let costo = 0;
  let kwhRestante = kwhMensual;
  const t = TARIFAS_CFE_2026;
  if (kwhMensual > t.dac.umbral) {
    costo = kwhMensual * t.dac.precio;
  } else {
    const kwhBasico = Math.min(kwhRestante, t.basico.limite);
    costo += kwhBasico * t.basico.precio;
    kwhRestante -= kwhBasico;
    if (kwhRestante > 0) {
      const kwhIntermedio = Math.min(kwhRestante, t.intermedio.limite);
      costo += kwhIntermedio * t.intermedio.precio;
      kwhRestante -= kwhIntermedio;
    }
    if (kwhRestante > 0) costo += kwhRestante * t.excedente.precio;
  }
  return Math.round(costo * (1 + t.iva));
}

// ─── CÁLCULO PRINCIPAL ────────────────────────────────────────────────────────
let ultimoDiseno = null;

function calcular() {
  const t = TEXTS[currentLang];
  let totalKwh = 0, count = 0;
  const tipo = document.getElementById('tipoTarifa').value;
  const selector = tipo === 'bimestral' ? '.in-kwh' : '.in-kwh-m';
  const wattsPorPanel = parseInt(document.getElementById('panelWatts').value) || 550;
  const tipoInv = document.getElementById('tipoInversor').value || 'estandar';
  const kwAdicional = parseFloat(document.getElementById('kwAdicional').value) || 0;
  const divisorDias = tipo === 'bimestral' ? 61 : 30.4;

  document.querySelectorAll(selector).forEach(i => {
    if (i.value > 0) { totalKwh += Number(i.value); count++; }
  });

  if (totalKwh <= 0 || count === 0) {
    document.getElementById('panelCount').innerText = 0;
    document.getElementById('sistemaKwLabel').innerText = '0 kW';
    document.getElementById('whatsappLeadSection').style.display = 'none';
    ultimoDiseno = null;
    return;
  }

  const promedioDiarioKwh = (totalKwh / count) / divisorDias;
  const kwpBase = (promedioDiarioKwh / HSP) / EFFICIENCY;
  const kwpTotal = kwpBase + kwAdicional;

  // Determinar fase (puede haber sido forzada por tarifa)
  let faseActual = document.getElementById('tipoFase').value;
  // Si monofásico pero >=10kW, recomendar trifásico
  const alertEl = document.getElementById('alertPhase');
  const tarifa = document.getElementById('tarifaCFE').value;
  if (kwpTotal >= 10 && faseActual !== 'trifasico' && !TARIFAS_TRIFASICO.includes(tarifa)) {
    alertEl.style.display = 'block';
    alertEl.innerText = t.alertPhase10kw;
  } else if (!TARIFAS_TRIFASICO.includes(tarifa)) {
    alertEl.style.display = 'none';
  }

  // Normalizar fase para el catálogo (bifásico → monofásico en catálogo)
  const faseCatalogo = (faseActual === 'trifasico') ? 'trifasico' : 'monofasico';

  // Diseñar sistema
  const diseno = disenarSistema(kwpTotal, faseCatalogo, tipoInv);
  ultimoDiseno = { diseno, faseActual, kwpTotal, wattsPorPanel, tipoInv };

  // Paneles
  const paneles = Math.ceil((diseno.kwTotal * 1000) / wattsPorPanel);
  document.getElementById('panelCount').innerText = paneles;
  document.getElementById('sistemaKwLabel').innerText = `${diseno.kwTotal} kW`;

  // Info inversor
  document.getElementById('inverterInfoTitle').innerText = t.invInfo(diseno);
  document.getElementById('inverterInfoDetail').innerText = diseno.modelo;

  actualizarBotonWhatsApp(diseno, paneles, wattsPorPanel, faseActual, kwpTotal);
}

function actualizarBotonWhatsApp(diseno, paneles, wattsPorPanel, faseActual, kwpTotal) {
  if (!diseno) { document.getElementById('whatsappLeadSection').style.display = 'none'; return; }
  const t = TEXTS[currentLang];

  // Precio estimado
  const precioBase = Math.round(diseno.kwTotal * PRECIO_POR_KW);
  const tieneSuma = document.getElementById('cuponSuma').checked;
  const precioFinal = tieneSuma ? Math.round(precioBase * (1 - DESCUENTO_SUMA)) : precioBase;

  // Consumo
  const tipo = document.getElementById('tipoTarifa').value;
  const selector = tipo === 'bimestral' ? '.in-kwh' : '.in-kwh-m';
  let totalKwh = 0, count = 0;
  document.querySelectorAll(selector).forEach(i => {
    if (i.value > 0) { totalKwh += Number(i.value); count++; }
  });
  const promedioKwhPeriodo = count > 0 ? Math.round(totalKwh / count) : 0;
  const promedioKwhMensual = promedioKwhPeriodo * (tipo === 'bimestral' ? 0.5 : 1);
  const reciboSinSolar = calcularReciboCFE(promedioKwhMensual);

  // UI
  document.getElementById('sistemaRecomendado').innerText = diseno.kwTotal;
  document.getElementById('descripcionSistema').innerText = t.sysDesc(diseno.inversores, diseno.kwPorInversor, paneles, wattsPorPanel);

  if (tieneSuma) {
    document.getElementById('precioContainer').innerHTML = `<span class="precio-tachado">$${precioBase.toLocaleString('es-MX')}</span> <strong style="color:#059669;">$${precioFinal.toLocaleString('es-MX')}</strong> <span style="background:#dcfce7; color:#059669; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:700;">-10% SUMA</span>`;
  } else {
    document.getElementById('precioContainer').innerHTML = `<strong>$${precioBase.toLocaleString('es-MX')}</strong>`;
  }

  document.getElementById('reciboActual').innerText = reciboSinSolar.toLocaleString('es-MX');
  document.getElementById('ahorroEstimado').innerText = reciboSinSolar.toLocaleString('es-MX');
  document.getElementById('whatsappLeadSection').style.display = 'block';

  // WhatsApp message
  const nombre = document.getElementById('nombre').value || (currentLang === 'es' ? 'Cliente' : 'Customer');
  const periodo = t.waPeriod(tipo);
  const textoSuma = tieneSuma ? t.waSuma : t.waNoSuma;
  const tarifaSeleccionada = document.getElementById('tarifaCFE').value;
  const faseTexto = document.getElementById('tipoFase').selectedOptions[0].text;

  const waData = {
    kwh: promedioKwhPeriodo,
    periodo,
    recibo: reciboSinSolar.toLocaleString('es-MX'),
    tarifa: tarifaSeleccionada,
    fase: faseTexto,
    kwSistema: diseno.kwTotal,
    inv: diseno.inversores,
    kwInv: diseno.kwPorInversor,
    paneles,
    watt: wattsPorPanel,
    modelo: diseno.modelo,
    precio: precioFinal.toLocaleString('es-MX'),
    suma: textoSuma,
    nombre
  };

  const mensaje = `${t.waGreet}%0A%0A${t.waLines(waData)}`;
  document.getElementById('btnWhatsAppBajaPro').href = `https://wa.me/5216122198325?text=${mensaje}`;
}
