    function changeLang(lang) {
      currentLang = lang;

      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

    function alternarInputs() {
      const tipo = document.getElementById('tipoTarifa').value;
      document.getElementById('gridBimestre').classList.toggle('hidden', tipo !== 'bimestral');
      document.getElementById('gridMes').classList.toggle('hidden', tipo !== 'mensual');
      calcular();
    }
 
    function calcularReciboCFE(kwhMensual) {
      let costo = 0;
      let kwhRestante = kwhMensual;
      const t = TARIFAS_CFE_2026;
      if (kwhMensual > t.dac.umbral) {
        costo = kwhMensual * t.dac.precio;
      } else {
        const kwhBasico = Math.min(kwhRestante, t.basico.limite);
        costo += kwhBasico * t.basico.precio;
        kwhRestante -= kwhBasico;
        if (kwhRestante > 0) {
          const kwhIntermedio = Math.min(kwhRestante, t.intermedio.limite);
          costo += kwhIntermedio * t.intermedio.precio;
          kwhRestante -= kwhIntermedio;
        }
        if (kwhRestante > 0) costo += kwhRestante * t.excedente.precio;
      }
      return Math.round(costo * (1 + t.iva));
    }
 
    function calcular() {
      let totalKwh = 0;
      let count = 0;
      const tipo = document.getElementById('tipoTarifa').value;
      const selector = tipo === 'bimestral' ? '.in-kwh' : '.in-kwh-m';
      const currentPanelWatt = Number(document.getElementById('panelWatts').value);
      const divisorDias = tipo === 'bimestral' ? 61 : 30.4;
 
      document.querySelectorAll(selector).forEach(i => {
        if (i.value > 0) { totalKwh += Number(i.value); count++; }
      });
 
      if (totalKwh > 0 && count > 0) {
        const promedioDiarioKwh = (totalKwh / count) / divisorDias;
        const kwpNecesario = (promedioDiarioKwh / HSP) / EFFICIENCY;
        const numeroPaneles = Math.ceil((kwpNecesario * 1000) / currentPanelWatt);
        document.getElementById('panelCount').innerText = numeroPaneles;
      } else {
        document.getElementById('panelCount').innerText = 0;
      }
      actualizarBotonWhatsApp();
    }
 
    function actualizarBotonWhatsApp() {
      const t = TEXTS[currentLang];
      const panelesCalc = parseInt(document.getElementById('panelCount').innerText) || 0;
      const wattsPorPanel = parseInt(document.getElementById('panelWatts').value) || 550;
 
      if (panelesCalc === 0) {
        document.getElementById('whatsappLeadSection').style.display = 'none';
        return;
      }
 
      const kwNecesarios = (panelesCalc * wattsPorPanel) / 1000;
      const kwRedondeado = Math.ceil(kwNecesarios);
      const kwsDisponibles = Object.keys(SISTEMAS_INTERCONECTADOS).map(Number).sort((a, b) => a - b);
      let kwElegido = kwsDisponibles.find(kw => kw >= kwRedondeado) || 8;
      const sistemaBase = SISTEMAS_INTERCONECTADOS[kwElegido];
      const sistemaElegido = { ...sistemaBase, kw: kwElegido };
 
      document.getElementById('panelCount').innerText = sistemaElegido.paneles;
 
      let totalKwh = 0, count = 0;
      const tipo = document.getElementById('tipoTarifa').value;
      const selector = tipo === 'bimestral' ? '.in-kwh' : '.in-kwh-m';
      document.querySelectorAll(selector).forEach(i => {
        if (i.value > 0) { totalKwh += Number(i.value); count++; }
      });
      const promedioKwhPeriodo = count > 0 ? Math.round(totalKwh / count) : 0;
      const promedioKwhMensual = promedioKwhPeriodo * (tipo === 'bimestral' ? 0.5 : 1);
 
      const reciboSinSolar = calcularReciboCFE(promedioKwhMensual);
      const tieneSuma = document.getElementById('cuponSuma').checked;
      const precioFinal = tieneSuma ? Math.round(sistemaElegido.precio * (1 - DESCUENTO_SUMA)) : sistemaElegido.precio;
 
      document.getElementById('sistemaRecomendado').innerText = sistemaElegido.kw;
      document.getElementById('descripcionSistema').innerText = `${t.sysNombre(sistemaElegido)} – ${t.sysDesc(sistemaElegido)} | ${sistemaElegido.paneles} ${t.tPanels.toLowerCase()} / Inversor ${sistemaElegido.inversor}`;
 
      if (tieneSuma) {
        document.getElementById('precioContainer').innerHTML = `<span class="precio-tachado">$${sistemaElegido.precio.toLocaleString('es-MX')}</span> <strong style="color:#059669;">$${precioFinal.toLocaleString('es-MX')}</strong> <span style="background:#dcfce7; color:#059669; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:700;">-10% SUMA</span>`;
      } else {
        document.getElementById('precioContainer').innerHTML = `<strong>$${sistemaElegido.precio.toLocaleString('es-MX')}</strong>`;
      }
 
      document.getElementById('reciboActual').innerText = reciboSinSolar.toLocaleString('es-MX');
      document.getElementById('ahorroEstimado').innerText = reciboSinSolar.toLocaleString('es-MX');
      document.getElementById('whatsappLeadSection').style.display = 'block';
 
      const nombre = document.getElementById('nombre').value || (currentLang === 'es' ? 'Cliente' : 'Customer');
      const periodo = t.waPeriod(tipo);
      const textoSuma = tieneSuma ? t.waSuma : t.waNoSuma;
      const tarifaSeleccionada = document.getElementById('tarifaCFE').value;
      const faseSeleccionada = document.getElementById('tipoFase').selectedOptions[0].text;
 
      const waData = {
        kwh: promedioKwhPeriodo,
        periodo,
        recibo: reciboSinSolar.toLocaleString('es-MX'),
        tarifa: tarifaSeleccionada,
        fase: faseSeleccionada,
        sistNombre: t.sysNombre(sistemaElegido),
        paneles: sistemaElegido.paneles,
        inversor: sistemaElegido.inversor,
        precio: precioFinal.toLocaleString('es-MX'),
        suma: textoSuma,
        nombre
      };
 
      const mensaje = `${t.waGreet}%0A%0A${t.waLines(waData)}`;
      document.getElementById('btnWhatsAppBajaPro').href = `https://wa.me/5216122198325?text=${mensaje}`;
    }
 
    document.querySelectorAll('.in-kwh,.in-kwh-m, #panelWatts, #tipoTarifa, #tarifaCFE, #tipoFase').forEach(el => {
      el.addEventListener('input', calcular);
      el.addEventListener('change', calcular);
    });

      );
      window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
    }
